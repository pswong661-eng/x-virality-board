<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307090d' width='32' height='32'/%3E%3Ccircle fill='%237ee7ff' cx='16' cy='16' r='6'/%3E%3C/svg%3E">
  <title>Mission Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-sheet="floor">
  <canvas id="view" aria-label="Three-dimensional mission control office"></canvas>
  <div id="hud">
    <div class="stat" id="stat"></div>
    <aside class="panel panel-left" aria-label="Waiting on Eric and the fleet">
      <section class="block grow" id="waiting"></section>
      <section class="block fleet" id="fleet"></section>
    </aside>
    <aside class="panel panel-right" aria-label="Activity and routines">
      <section class="block heat-block" id="heatmap"></section>
      <section class="block grow" id="timeline"></section>
      <section class="block grow" id="routines"></section>
    </aside>
    <section class="detail" id="detail" hidden aria-live="polite"></section>
    <div class="hover" id="hover" hidden></div>
    <p class="hint" id="hint"></p>
    <nav class="tabs" id="tabs" aria-label="Panels"></nav>
    <p class="banner" id="banner" hidden></p>
  </div>
  <noscript>Mission Control needs JavaScript to read the data file and draw the office.</noscript>
  <script src="data.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
